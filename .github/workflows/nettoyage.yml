# Ménage ponctuel : supprime les anciennes versions 0.2.0 et 0.2.1 et leurs étiquettes
# (relancé après réécriture de l’historique)
name: Nettoyage des versions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nettoyage.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          for tag in v0.2.0 v0.2.1; do
            for id in $(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id"); do
              echo "Suppression de la version $tag ($id)"
              gh api -X DELETE "repos/$REPO/releases/$id"
            done
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" && echo "Étiquette $tag supprimée" || true
          done
          gh api "repos/$REPO/releases" --jq '.[] | [.tag_name, ([.assets[].name] | join(", "))] | @tsv'
